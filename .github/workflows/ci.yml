name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            torch: '2.5.1'
          - python: '3.12'
            torch: '2.6.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'torch==${{ matrix.torch }}' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q
      - run: python examples/model_roundtrip.py --output /tmp/model.p2i
      - run: python -m build
