name: External model compatibility
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: Run CUDA checks on an available self-hosted GPU runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,compatibility]'
      - run: python -m pytest -q tests/test_compatibility.py tests/test_recurrent_planning.py
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0
      - run: python -m pip install -e '.[test,compatibility]'
      - run: python -m pytest -q tests/test_compatibility.py tests/test_recurrent_planning.py
        env:
          P2I_TEST_DEVICE: cuda
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
